[project]
name = "askrag"
version = "0.1.0"
description = "askRAG backend: agentic RAG over the arXiv corpus (spec D1-D14)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    # chromadb pinned exactly: the embedded store's on-disk format must not
    # drift under us between ingest and serve (spec D4).
    "chromadb==1.5.9",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "pyarrow==24.0.0",
    "pydantic-settings>=2.14.2",
    "pymupdf4llm>=1.28.0",
    "sentence-transformers==5.6.0",
    "sse-starlette>=3.4.5",
    "tiktoken>=0.13.0",
    "torch==2.12.1",
    "uvicorn>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty==0.0.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["askrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # pymupdf's SWIG bindings emit these, not our code; tracked upstream.
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import order, UP modernize, B bugbear traps.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom: `Depends(...)`/`Query(...)` in an argument default is
# how the framework wires dependency injection and query-param parsing, not
# the mutable-default-arg bug B008 exists to catch (#30 added Depends; #27
# adds Query, this repo's first querystring-parsing route).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ty.environment]
# Checked at the lowest supported version so 3.13-only APIs can't sneak in.
python-version = "3.12"

# torch on linux resolves from PyTorch's CPU index, not PyPI (issue #81,
# DECISIONS.md 2026-08-11). PyPI's linux torch drags the whole CUDA stack
# (cuda-toolkit + 20 nvidia-* wheels, 2.9 GB) into an environment that will
# never have a GPU: D13 sizes prod at 2 vCPU / 4 GB, and embedding runs are
# CPU/MPS by measurement (D5). Marker-scoped to linux on purpose — macOS
# wheels carry no CUDA and MPS lives in the PyPI build, so dev machines
# resolve exactly as before.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
