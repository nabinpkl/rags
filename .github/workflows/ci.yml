# The single gate: CI runs `just check`, the same command every role runs
# locally, so local green == CI green by construction (issue #44).
# frontend-check self-skips until #26 scaffolds frontend/ (then add pnpm here).
# No corpus access in CI: tests build tmp fixtures. Eval smoke lands with #24.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Every `uv run` inside `just check` asserts uv.lock is current —
      # replaces the old explicit `uv sync --locked` step.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: extractions/setup-just@v3
      - run: just check
