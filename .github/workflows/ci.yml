# The single gate: CI runs `just check`, the same command every role runs
# locally, so local green == CI green by construction (issue #44).
# frontend-check runs pnpm lint+typecheck+test+typegen-drift (issue #26).
# No corpus access in CI: tests build tmp fixtures. Eval smoke lands with #24.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Every `uv run` inside `just check` asserts uv.lock is current —
      # replaces the old explicit `uv sync --locked` step.
      UV_LOCKED: "1"
    steps:
      # Actions SHA-pinned per the dependency gate (sdlc.md, 6950549); the
      # trailing comment names the tag each SHA was resolved from.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          # One shared workspace lock at the repo root (issue #79) — no more
          # per-package backend/uv.lock.
          cache-dependency-glob: uv.lock
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      # Frontend toolchain for `just check`'s frontend-check tier (#26). The
      # pnpm version comes from frontend/package.json's packageManager field;
      # point action-setup at it since it defaults to the (absent) root one.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: just check
